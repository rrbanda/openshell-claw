# Model Provider Profile -- OpenAI-compatible endpoint
#
# BEFORE USING: Replace PLACEHOLDERs:
#   PLACEHOLDER_MODEL_HOST -> model API hostname (e.g. api.example.com)
#
id: model-provider
display_name: Model Provider for OpenClaw
description: OpenAI-compatible model endpoint
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Model API key
    env_vars: [CUSTOM_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: PLACEHOLDER_MODEL_HOST
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/bin/node]
