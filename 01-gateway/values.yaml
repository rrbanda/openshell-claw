# OpenShell Gateway 0.1.3 Helm values -- disconnected environment
#
# BEFORE USING: Replace every PLACEHOLDER below with your actual values.
#
#   PLACEHOLDER_REGISTRY      -> your mirror registry WITH the nvidia prefix
#                                Example: registry.example.com:5000/nvidia
#                                The chart appends /openshell/gateway, /openshell/supervisor, etc.
#
#                                IMPORTANT: Gateway and Dashboard need DIFFERENT registry values:
#                                | Chart     | Value                             | Why                   |
#                                |-----------|-----------------------------------|-----------------------|
#                                | Gateway   | registry.example.com:5000/nvidia  | repos: openshell/*    |
#                                | Dashboard | registry.example.com:5000         | repos: gkrumbach07/*  |
#
#   PLACEHOLDER_KC_ISSUER     -> Keycloak issuer URL (e.g. https://sso.example.com/realms/openshell)
#   PLACEHOLDER_KC_AUDIENCE   -> Keycloak API client ID (e.g. openshell-api-013)
#   PLACEHOLDER_KC_ROLESCLAIM -> Roles claim path (e.g. resource_access.openshell-api-013.roles)
#   PLACEHOLDER_ADMIN_ROLE    -> Admin role name from Keycloak (e.g. administrators-a)
#   PLACEHOLDER_USER_ROLE     -> User role name from Keycloak (e.g. users-a)
#   PLACEHOLDER_GATEWAY_HOST  -> Route hostname (e.g. openshell-gw.apps.cluster.example.com)
#   PLACEHOLDER_SANDBOX_IMAGE -> Default sandbox base image in your mirror
#                                Example: registry.example.com:5000/nvidia/base/ubuntu

# --- Image registry override for disconnected ---
global:
  image:
    registry: PLACEHOLDER_REGISTRY

# --- OpenShift pod security ---
podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

# --- Gateway server ---
server:
  name: openshell-0-1-3
  logLevel: info
  telemetryEnabled: true

  drivers:
    kubernetes:
      workspaceMode: "managed"

  disableTls: false

  auth:
    # Allow mTLS-only CLI connections without an OIDC token.
    # true  = disconnected/bastion (no browser for OIDC login)
    # false = all CLI users can authenticate via OIDC (laptop with browser)
    allowUnauthenticatedUsers: true

  tls:
    enableMtls: true
    certSecretName: openshell-server-tls
    clientCaSecretName: openshell-server-client-ca
    clientTlsSecretName: openshell-client-tls

  oidc:
    issuer: "PLACEHOLDER_KC_ISSUER"
    audience: "PLACEHOLDER_KC_AUDIENCE"
    rolesClaim: "PLACEHOLDER_KC_ROLESCLAIM"
    # Roles MUST be set to match Keycloak client role names.
    # The gateway defaults to 'openshell-admin'/'openshell-user' if empty,
    # which won't match your Keycloak roles.
    # allowUnauthenticatedUsers=true lets mTLS CLI bypass role checks,
    # while OIDC dashboard users get their roles validated.
    adminRole: "PLACEHOLDER_ADMIN_ROLE"
    userRole: "PLACEHOLDER_USER_ROLE"

# --- PKI bootstrap + Route ---
# serverDnsNames MUST include the Route hostname for TLS to work.
pkiInitJob:
  enabled: true
  serverIpAddresses:
    - "127.0.0.1"
  serverDnsNames:
    - "PLACEHOLDER_GATEWAY_HOST"

# --- OpenShift Route ---
# TLS passthrough. Comment out if using port-forward instead.
openshiftRoute:
  enabled: true
  host: "PLACEHOLDER_GATEWAY_HOST"

# --- RBAC ---
rbac:
  create: true
  clusterRoles:
    create: true

# --- Network policy ---
networkPolicy:
  enabled: true

# --- Default sandbox base image (REQUIRED for disconnected) ---
# Dashboard "Create Sandbox" with empty image field pulls this.
sandbox:
  image:
    repository: PLACEHOLDER_SANDBOX_IMAGE
    tag: "24.04"

# --- Optional: Image pull secrets (uncomment if mirror needs auth) ---
# oc -n openshell-0-1-3 create secret docker-registry mirror-pull-secret \
#   --docker-server=YOUR_REGISTRY --docker-username=USER --docker-password=PASS
# server:
