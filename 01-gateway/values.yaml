# OpenShell Gateway 0.1.3 Helm values -- disconnected environment
#
# BEFORE USING: Replace every PLACEHOLDER below with your actual values.
#
#   PLACEHOLDER_REGISTRY      -> your mirror registry WITH the nvidia prefix
#                                Example: registry.example.com:5000/nvidia
#                                The chart appends /openshell/gateway, /openshell/supervisor, etc.
#                                So the full image becomes: registry.example.com:5000/nvidia/openshell/gateway:0.1.3
#
#                                IMPORTANT: The gateway and dashboard charts need DIFFERENT registry values:
#                                | Chart     | PLACEHOLDER_REGISTRY value        | Why                            |
#                                |-----------|-----------------------------------|--------------------------------|
#                                | Gateway   | registry.example.com:5000/nvidia  | repos are openshell/*          |
#                                | Dashboard | registry.example.com:5000         | repos are gkrumbach07/*, etc.  |
#
#   PLACEHOLDER_KC_ISSUER     -> Keycloak issuer URL (e.g. https://sso.example.com/realms/openshell)
#   PLACEHOLDER_KC_AUDIENCE   -> Keycloak API client ID (e.g. openshell-api-013)
#   PLACEHOLDER_KC_ROLESCLAIM -> Roles claim path (e.g. resource_access.openshell-api-013.roles)
#   PLACEHOLDER_ADMIN_ROLE    -> Admin role name (e.g. administrators-a)
#   PLACEHOLDER_USER_ROLE     -> User role name (e.g. users-a)
#   PLACEHOLDER_SANDBOX_IMAGE -> Default sandbox base image in your mirror
#                                Example: registry.example.com:5000/nvidia/base/ubuntu

# --- Image registry override for disconnected ---
# IMPORTANT: This must include the /nvidia prefix because chart repositories
# are relative paths like openshell/gateway, openshell/supervisor, etc.
global:
  image:
    registry: PLACEHOLDER_REGISTRY

# --- OpenShift pod security ---
podSecurityContext:
  fsGroup: null

securityContext:
  runAsUser: null

# --- Gateway server ---
server:
  name: openshell-0-1-3
  logLevel: info
  telemetryEnabled: true

  drivers:
    kubernetes:
      workspaceMode: "managed"

  disableTls: false

  auth:
    allowUnauthenticatedUsers: false

  tls:
    enableMtls: true
    certSecretName: openshell-server-tls
    clientCaSecretName: openshell-server-client-ca
    clientTlsSecretName: openshell-client-tls

  oidc:
    issuer: "PLACEHOLDER_KC_ISSUER"
    audience: "PLACEHOLDER_KC_AUDIENCE"
    rolesClaim: "PLACEHOLDER_KC_ROLESCLAIM"
    adminRole: "PLACEHOLDER_ADMIN_ROLE"
    userRole: "PLACEHOLDER_USER_ROLE"

# --- PKI bootstrap ---
pkiInitJob:
  enabled: true
  serverIpAddresses:
    - "127.0.0.1"

# --- Image pull secrets for mirror registry (disconnected) ---
# If your mirror registry requires authentication, create a pull secret first:
#   oc -n openshell-0-1-3 create secret docker-registry mirror-pull-secret \
#     --docker-server=PLACEHOLDER_REGISTRY \
#     --docker-username=YOUR_USER \
#     --docker-password=YOUR_PASS
# Then uncomment the lines below:
# server:
#   sandboxImagePullSecrets:
#     - name: mirror-pull-secret
# imagePullSecrets:
#   - name: mirror-pull-secret

# --- Keycloak private CA (uncomment if Keycloak uses a private/self-signed cert) ---
# If the Keycloak issuer uses a non-public CA (e.g. internal cert-manager, self-signed),
# create a ConfigMap with the CA cert:
#   oc -n openshell-0-1-3 create configmap keycloak-ca --from-file=ca.crt=/path/to/ca.crt
# Then uncomment:
#   oidc:
#     caConfigMapName: "keycloak-ca"

# --- RBAC ---
rbac:
  create: true
  clusterRoles:
    create: true

# --- Network policy ---
networkPolicy:
  enabled: true

# --- Default sandbox base image (disconnected override) ---
# The chart default is nvcr.io/nvidia/base/ubuntu:24.04 which won't resolve
# in a disconnected environment. Override with your mirror path.
sandbox:
  image:
    repository: PLACEHOLDER_SANDBOX_IMAGE
    tag: "24.04"
